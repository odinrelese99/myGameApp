name: Sync Game Fixes

on:
  schedule:
    - cron: '0 2 * * *'    # يومياً الساعة 2 صباحاً UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-games-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get list of game apps from data.json
        run: |
          # استخراج كل AppID من data.json
          jq -r 'to_entries[].value | keys[]' data.json > appids.txt
          echo "Found $(wc -l < appids.txt) games"

      - name: Sync fixes for each game
        run: |
          mkdir -p gamesFixes
          while IFS= read -r appid; do
            if [ ! -d "gamesFixes/$appid" ]; then
              echo "Syncing fix for $appid..."
              # محاولة تحميل من branch خاص بالـ AppID
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                "https://api.github.com/repos/LightnigFast/gamesFixes/branches/$appid")
              
              if [ "$HTTP_CODE" = "200" ]; then
                #.Branch موجود - حمّل من root
                curl -sL "https://api.github.com/repos/LightnigFast/gamesFixes/contents/?ref=$appid" \
                  | jq -r '.[].download_url' | while read url; do
                    [ "$url" != "null" ] && curl -sL "$url" -o "gamesFixes/$appid/$(basename $url)"
                  done
              fi
            fi
          done < appids.txt

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync game fixes [skip ci]"
            git push
          fi
