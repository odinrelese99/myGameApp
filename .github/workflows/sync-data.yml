name: Sync Data from Upstream

on:
  schedule:
    - cron: '0 */6 * * *'    # كل 6 ساعات
  workflow_dispatch:          # للتشغيل اليدوي

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JSON files from Project Lightning
        run: |
          SOURCE="https://raw.githubusercontent.com/LightnigFast/Project-Lightning/main"
          curl -sL "$SOURCE/data.json" -o data.json
          curl -sL "$SOURCE/data-fix.json" -o data-fix.json
          curl -sL "$SOURCE/shop.json" -o shop.json
          curl -sL "$SOURCE/latest-version.txt" -o latest-version.txt

      - name: Validate JSON
        run: |
          for f in data.json data-fix.json shop.json; do
            if ! jq empty "$f" 2>/dev/null; then
              echo "Invalid JSON: $f - skipping this file"
              rm -f "$f"
            fi
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-sync data from upstream [skip ci]"
            git push
          fi
