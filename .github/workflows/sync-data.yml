name: Sync Data from Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data.json
        run: curl -sL "https://raw.githubusercontent.com/LightnigFast/Project-Lightning/main/data.json" -o data.json

      - name: Fetch data-fix.json
        run: curl -sL "https://raw.githubusercontent.com/LightnigFast/Project-Lightning/main/data-fix.json" -o data-fix.json

      - name: Fetch latest-version.txt
        run: curl -sL "https://raw.githubusercontent.com/LightnigFast/Project-Lightning/main/latest-version.txt" -o latest-version.txt

      - name: Check files exist
        run: |
          ls -la data.json
          ls -la data-fix.json
          ls -la latest-version.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync data [skip ci]"
            git push
          fi
